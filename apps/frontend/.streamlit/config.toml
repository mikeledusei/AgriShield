[theme]
base = "light"
primaryColor = "#2b6842"
backgroundColor = "#f6f8f3"
secondaryBackgroundColor = "#edf4e9"
textColor = "#203b2a"

[browser]
gatherUsageStats = false

# Security posture.
#
# enableCORS stays true and XSRF protection stays on. Setting
# `server.enableCORS = false` makes the app answer any origin and accept a
# WebSocket from anywhere, which is why it is not used here.
#
# `corsAllowedOrigins` and `allowedHosts` are environment-specific and are passed
# at run time instead, from AGRISHIELD_ALLOWED_ORIGINS / AGRISHIELD_ALLOWED_HOSTS
# (see the deployment runbook). Leaving them unset keeps the app reachable behind a
# proxy whose hostname is not known at build time.

[server]
enableCORS = true
enableXsrfProtection = true
headless = true
maxUploadSize = 10

[client]
# Never render tracebacks to end users: the dashboard is public, and a stack trace
# discloses internal paths and library versions. Operators read the server log instead
# (every backend response carries X-Request-ID for correlation).
showErrorDetails = "none"
toolbarMode = "minimal"
