name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/frontend/requirements.txt
      - name: Install dependencies
        run: pip install -r apps/backend/requirements.txt -r apps/frontend/requirements.txt "matplotlib>=3.9,<4" pytest
      - name: Compile Python sources
        run: python -m compileall -q apps/backend apps/frontend data_pipeline/scripts ml-models/scripts
      - name: Run test suite
        run: python -m pytest tests -q
