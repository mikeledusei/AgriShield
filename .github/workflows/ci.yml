name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/frontend/requirements.txt
            data_pipeline/requirements.txt
            ml-models/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # One CI interpreter runs the root test suite, which imports the backend, the
          # dashboard, data_pipeline and the research notebooks' libraries. Each
          # per-component requirements.txt is self-sufficient, so install all four into
          # this single environment (locally each lives in its own venv).
          #
          # Because they share one resolver, any package pinned to two versions across
          # these files makes the whole install fail with ResolutionImpossible before a
          # single test runs. Keep shared pins identical (scikit-learn is the one to watch:
          # it must stay 1.9.0, the version the champion artifact was fitted with).
          pip install -r apps/backend/requirements.txt \
                      -r apps/frontend/requirements.txt \
                      -r data_pipeline/requirements.txt \
                      -r ml-models/requirements.txt

      - name: Lint
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q apps/backend apps/frontend data_pipeline

      - name: Migrations apply and roll back
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          cd apps/backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Dependency audit (informational)
        continue-on-error: true
        run: pip-audit --skip-editable

  # The documented deployment path is `docker build -f apps/backend/Dockerfile .`.
  # Nothing else in CI exercises it, so a stale COPY (a deleted constraints.txt, a moved
  # data file) previously broke the image without any signal here.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f apps/backend/Dockerfile -t agrishield-api:ci .

      - name: Import the app inside the image
        run: |
          docker run --rm agrishield-api:ci python -c "
          import main
          print('app import OK:', main.app.title)
          "

      - name: Apply migrations inside the image
        run: |
          docker run --rm -e DATABASE_URL=sqlite:////tmp/ci.db agrishield-api:ci \
            sh -c 'alembic upgrade head && alembic downgrade base'
