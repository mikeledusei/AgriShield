name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/backend/requirements-dev.txt
            apps/frontend/requirements.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements-dev.txt -r apps/frontend/requirements.txt -c constraints.txt

      - name: Lint
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q apps/backend apps/frontend data_pipeline/scripts

      - name: Migrations apply and roll back
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          cd apps/backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run test suite
        run: python -m pytest tests -q

      - name: Dependency audit (informational)
        continue-on-error: true
        run: pip-audit --skip-editable
