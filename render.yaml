# Render Blueprint — AgriShield Backend (Neon PostgreSQL)
# Docs: https://render.com/docs/blueprint-spec
# Deploys ONLY the FastAPI backend. Streamlit dashboard is separate (Vercel/Streamlit Cloud).
# Every key with `sync: false` MUST be set manually in Render Dashboard → Environment.

services:
  - type: web
    name: agrishield-api
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r apps/backend/requirements.txt
    preDeployCommand: cd apps/backend && alembic upgrade head && python seed_counties.py
    startCommand: cd apps/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/ready
    autoDeploy: false
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_MODE
        value: "True"
      - key: NVIDIA_MODEL
        value: mistralai/mistral-large-4-1t-a52b
      # --- Must be set in Render Dashboard (sync: false) ---
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      # --- Generated once on first deploy ---
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
