# Render blueprint: the backend only. The Streamlit dashboard is deployed separately.
# Every secret referenced with `sync: false` must be set in the Render dashboard.
services:
  - type: web
    name: agrishield-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r apps/backend/requirements.txt
    # Schema is applied once per deploy, before the new instance takes traffic.
    preDeployCommand: cd apps/backend && alembic upgrade head && python seed_counties.py
    startCommand: cd apps/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    # Readiness, not liveness: a deploy with a missing model or unapplied migration fails.
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      # Anonymous access is a prototype setting; production requires identity.
      - key: PUBLIC_MODE
        value: "False"
      - key: NVIDIA_MODEL
        value: meta/llama-3.3-70b-instruct
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
